<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIGZKY • KUNG TAYO</title>
<style>
:root{color-scheme:dark;--bg:#100d18;--panel:#1c1728;--muted:#a99fb8;--text:#fff;--accent:#c58cff;--accent2:#ff8ab5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#49305f 0,#1c1529 38%,var(--bg) 78%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;padding:24px 16px 36px}
.wrap{max-width:520px;margin:auto}.brand{text-align:center;letter-spacing:.28em;font-size:11px;color:#d9c6ec;font-weight:700;margin:6px 0 18px}.cover{width:min(78vw,340px);aspect-ratio:1;margin:0 auto 22px;border-radius:28px;background:linear-gradient(145deg,#ffb1ca 0%,#9b6bd2 48%,#272044 100%);box-shadow:0 22px 70px #0009;display:grid;place-items:center;position:relative;overflow:hidden}.cover:before,.cover:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}.cover:before{width:240px;height:240px;background:#ffd7e477;left:-70px;top:-80px}.cover:after{width:260px;height:260px;background:#241a4b88;right:-90px;bottom:-100px}.covertext{z-index:1;text-align:center;text-shadow:0 3px 16px #24122b88}.covertext small{display:block;letter-spacing:.38em;font-size:10px;margin-bottom:12px}.covertext strong{display:block;font-family:Georgia,serif;font-size:clamp(34px,10vw,54px);letter-spacing:.08em}.covertext span{display:block;font-size:11px;letter-spacing:.3em;margin-top:12px}.info{text-align:center;margin-bottom:20px}.info h1{font-size:24px;letter-spacing:.08em;margin:0 0 4px}.info p{margin:0;color:var(--muted);font-size:13px}.now{background:#ffffff0a;border:1px solid #ffffff12;border-radius:18px;padding:16px;margin:0 0 18px}.now .label{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.now .song{font-size:18px;font-weight:700;margin-top:5px}.now .artist{font-size:12px;color:var(--muted);margin-top:2px}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:14px}input[type=range]{width:100%;accent-color:var(--accent);margin:5px 0}.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 18px}.controls button,.smallcontrols button{border:0;color:white;background:transparent;font-size:23px;padding:8px;cursor:pointer}.controls .play{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#21142b;font-size:26px;font-weight:800;box-shadow:0 8px 26px #b879df55}.smallcontrols{display:flex;justify-content:center;gap:30px;margin-bottom:20px}.smallcontrols button{font-size:17px;color:var(--muted)}button.active{color:var(--accent)!important}.list{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:14px}.listhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px}.listhead strong{font-size:14px}.listhead span{font-size:11px;color:var(--muted)}.track{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;cursor:pointer}.track+.track{border-top:1px solid #ffffff0b}.track.current{background:#bd8bf21b}.num{width:22px;color:var(--muted);font-size:12px;text-align:center}.track.current .num{color:var(--accent)}.trackname{flex:1;font-size:13px;font-weight:600}.trackmeta{font-size:10px;color:var(--muted)}.playing{color:var(--accent);font-size:13px}.foot{text-align:center;color:#8e849b;font-size:10px;margin:18px 0 0;line-height:1.5}
</style></head>
<body><main class="wrap">
<div class="brand">MIGZKY MUSIC</div>
<div class="cover"><div class="covertext"><small>ORIGINAL STORY SOUNDTRACK</small><strong>KUNG<br>TAYO</strong><span>12 SONGS • MIGZKY</span></div></div>
<div class="info"><h1>KUNG TAYO</h1><p>Story Soundtrack • MIGZKY</p></div>
<section class="now"><div class="label">Now playing</div><div class="song" id="songTitle">KUNG TAYO</div><div class="artist">MIGZKY</div><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"></section>
<div class="controls"><button id="prev" aria-label="Previous">⏮</button><button class="play" id="play" aria-label="Play">▶</button><button id="next" aria-label="Next">⏭</button></div>
<div class="smallcontrols"><button id="shuffle" aria-label="Shuffle">🔀 Shuffle</button><button id="repeat" aria-label="Repeat">🔁 Repeat: Off</button></div>
<section class="list"><div class="listhead"><strong>ALBUM TRACKLIST</strong><span>12 TRACKS</span></div><div id="tracks"></div></section>
<p class="foot">Offline album player • Keep the “KUNG TAYO 12 TRACKS” folder together so the music files stay linked.</p>
<audio id="audio" preload="metadata"></audio>
</main>
<script>
const songs=[
['KUNG TAYO','01 - KUNG TAYO.mp3'],['KAIBIGAN LANG BA?','02 - KAIBIGAN LANG BA.mp3'],['PRIDE ANG KALABAN','03 - PRIDE ANG KALABAN.mp3'],['HINDI NA KITA HAHABULIN','04 - HINDI NA KITA HAHABULIN.mp3'],['NGAYON KITA HAHANAPIN','05 - NGAYON KITA HAHANAPIN.mp3'],['PAG-IBIG NA ITINAGO','06 - PAG-IBIG NA ITINAGO.mp3'],['SANA’Y BALIKAN','07 - SANAY BALIKAN.mp3'],['KUNG MAY PAG-ASA PA','08 - KUNG MAY PAG-ASA PA.mp3'],['ANG LIHIM NA SUMIRA SA ATIN','09 - ANG LIHIM NA SUMIRA SA ATIN.mp3'],['KAHIT MASAKTAN','10 - KAHIT MASAKTAN.mp3'],['KUNG TAYO NA LANG SANA','11 - KUNG TAYO NA LANG SANA.mp3'],['SA DULO, IKAW PA RIN','12 - SA DULO IKAW PA RIN.mp3']];
const audio=document.getElementById('audio'),playBtn=document.getElementById('play'),seek=document.getElementById('seek');let index=0,shuffle=false,repeat=0,seeking=false;
const fmt=t=>{if(!Number.isFinite(t))return '0:00';let m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};
function render(){document.getElementById('songTitle').textContent=songs[index][0];document.querySelectorAll('.track').forEach((el,i)=>{el.classList.toggle('current',i===index);el.querySelector('.playing').textContent=i===index?'♪':''});}
function load(i,autoplay=false){index=(i+songs.length)%songs.length;audio.src=encodeURIComponent(songs[index][1]);render();if(autoplay)audio.play().catch(()=>{});}
function next(){if(shuffle){let n;do{n=Math.floor(Math.random()*songs.length)}while(n===index&&songs.length>1);load(n,true)}else load(index+1,true)}
function prev(){if(audio.currentTime>3){audio.currentTime=0}else load(index-1,true)}
songs.forEach((s,i)=>{let d=document.createElement('div');d.className='track';d.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span class="trackname"></span><span class="playing"></span>`;d.querySelector('.trackname').textContent=s[0];d.addEventListener('click',()=>load(i,true));document.getElementById('tracks').appendChild(d)});
playBtn.onclick=()=>{if(audio.paused)audio.play().catch(()=>{});else audio.pause()};document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
audio.onplay=()=>playBtn.textContent='Ⅱ';audio.onpause=()=>playBtn.textContent='▶';audio.onended=()=>{if(repeat===2){audio.currentTime=0;audio.play()}else if(repeat===1)next();else if(index<songs.length-1)next();else{playBtn.textContent='▶'}};
audio.ontimeupdate=()=>{if(!seeking){seek.value=audio.duration?audio.currentTime/audio.duration*1000:0;document.getElementById('elapsed').textContent=fmt(audio.currentTime)}document.getElementById('duration').textContent=fmt(audio.duration)};
seek.oninput=()=>{seeking=true;document.getElementById('elapsed').textContent=fmt((seek.value/1000)*(audio.duration||0))};seek.onchange=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration;seeking=false};
document.getElementById('shuffle').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('active',shuffle)};
document.getElementById('repeat').onclick=e=>{repeat=(repeat+1)%3;e.currentTarget.textContent=['🔁 Repeat: Off','🔁 Repeat: All','🔂 Repeat: One'][repeat];e.currentTarget.classList.toggle('active',repeat!==0)};
load(0,false);
</script></body></html>
